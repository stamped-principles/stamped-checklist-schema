name: Validate LinkML Data

on:
    pull_request:
        paths:
            - "stamped-checklist-schema.yaml"
            - "stamped-checklist.json"
            - ".github/workflows/validate.yml"
            - ".github/scripts/*.py"
            - ".github/workflows/tag_release.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Test principles resolution
              run: python -m unittest discover -s .github/scripts -p "test_*.py"

            - name: Install LinkML
              run: pip install linkml

            - name: Validate checklist
              run: linkml-validate --schema ./stamped-checklist-schema.yaml --target-class Checklist ./stamped-checklist.json

            - name: Cross-schema referential integrity
              env:
                GITHUB_TOKEN: ${{ github.token }}
              run: |
                python .github/scripts/fetch_principles.py --output /tmp/schemas/stamped-principles.json
                python ./.github/scripts/check_cross_refs.py --principles /tmp/schemas/stamped-principles.json --checklist ./stamped-checklist.json
