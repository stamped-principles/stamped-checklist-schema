name: Tag release

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "stamped-checklist-schema.yaml"
            - "stamped-checklist.json"

permissions:
    contents: write

jobs:
    tag-release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Require released principles before creating tags
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  python .github/scripts/fetch_principles.py --output /tmp/schemas/stamped-principles.json
                  python .github/scripts/check_cross_refs.py --principles /tmp/schemas/stamped-principles.json --checklist stamped-checklist.json

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Tag schema version
              run: .github/scripts/tag_version.sh stamped-checklist-schema.yaml yaml schema-v Schema

            - name: Tag checklist version
              run: .github/scripts/tag_version.sh stamped-checklist.json json checklist-v Checklist

    notify-on-failure:
        permissions: {}
        runs-on: ubuntu-latest
        needs: [tag-release]
        if: ${{ always() && needs.tag-release.result == 'failure' }}
        steps:
            - uses: dawidd6/action-send-mail@v22
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  subject: "CI Failure: STAMPED Checklist Tag release"
                  to: cody.c.baker.phd@gmail.com
                  from: STAMPED Checklist <stamped-checklist-schema@users.noreply.github.com>
                  body: "The Tag release workflow failed on ${{ github.ref_name }} (${{ github.sha }}), please check status at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
