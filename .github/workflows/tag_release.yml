name: Tag release

on:
    push:
        branches:
            - main
        paths:
            - "stamped-checklist-schema.yaml"
            - "stamped-checklist.json"

permissions:
    contents: write

jobs:
    tag-release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Tag schema version
              run: .github/scripts/tag_version.sh stamped-checklist-schema.yaml yaml schema-v Schema

            - name: Tag checklist version
              run: .github/scripts/tag_version.sh stamped-checklist.json json checklist-v Checklist
